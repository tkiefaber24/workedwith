services:
  - type: web
    name: workedwith
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --workers 1 --threads 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: STUB_EMAIL
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"
